{% extends 'base.html' %}
{% block title %}Eliminar producto - MiTienda{% endblock %}
{% block content %}
<h1>Eliminar producto</h1>
<p>¿Estás seguro de que deseas eliminar <strong>{{ producto.nombre }}</strong>?</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit">Sí, eliminar</button>
</form>

<a href="{% url 'catalogo' %}">Cancelar</a>
{% endblock %}
