{% extends 'base.html' %}
{% block title %}Mi perfil - MiTienda{% endblock %}
{% block content %}
<h1>Mi perfil</h1>

<p>Usuario: {{ user.username }}</p>

{% if messages %}
{% for message in messages %}
<p>{{ message }}</p>
{% endfor %}
{% endif %}

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Guardar cambios</button>
</form>
{% endblock %}
